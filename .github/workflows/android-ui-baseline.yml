name: Android direct-dependency stable baseline

on:
  push:
    paths:
      - .github/workflows/android-ui-baseline.yml
      - .github/workflows/android.yml
      - ADBLOCK_CORE.lock
      - scripts/verify_adblock_native_package.py
      - scripts/tests/test_verify_adblock_native_package.py
      - scripts/verify_android_ui_latest.py
      - scripts/tests/test_verify_android_ui_latest.py
      - scripts/verify_android_application_services_latest.py
      - scripts/tests/test_verify_android_application_services_latest.py
      - THIRD_PARTY_NOTICES.md
      - app/src/main/assets/THIRD_PARTY_NOTICES.md
      - app/src/main/assets/licenses/adblock-rust-MPL-2.0.txt
      - build.gradle
      - build.gradle.kts
      - '**/build.gradle'
      - '**/build.gradle.kts'
      - gradle/verification-metadata.xml
      - sync-core/APPLICATION_SERVICES.lock
      - sync-core/build.gradle
      - sync-core/src/main/assets/THIRD_PARTY_NOTICES.md
      - settings.gradle
  pull_request:
    paths:
      - .github/workflows/android-ui-baseline.yml
      - .github/workflows/android.yml
      - ADBLOCK_CORE.lock
      - scripts/verify_adblock_native_package.py
      - scripts/tests/test_verify_adblock_native_package.py
      - scripts/verify_android_ui_latest.py
      - scripts/tests/test_verify_android_ui_latest.py
      - scripts/verify_android_application_services_latest.py
      - scripts/tests/test_verify_android_application_services_latest.py
      - THIRD_PARTY_NOTICES.md
      - app/src/main/assets/THIRD_PARTY_NOTICES.md
      - app/src/main/assets/licenses/adblock-rust-MPL-2.0.txt
      - build.gradle
      - build.gradle.kts
      - '**/build.gradle'
      - '**/build.gradle.kts'
      - gradle/verification-metadata.xml
      - sync-core/APPLICATION_SERVICES.lock
      - sync-core/build.gradle
      - sync-core/src/main/assets/THIRD_PARTY_NOTICES.md
      - settings.gradle
  schedule:
    - cron: '29 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-stable-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test Android direct-dependency latest-stable policy
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_verify_android_ui_latest.py' -v
      - name: Verify direct Android dependencies use official stable releases
        run: python3 scripts/verify_android_ui_latest.py
      - name: Test Android Application Services latest-stable policy
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_verify_android_application_services_latest.py' -v
      - name: Verify Android AARs match latest stable Application Services
        run: python3 scripts/verify_android_application_services_latest.py
