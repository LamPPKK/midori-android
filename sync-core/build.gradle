plugins {
    id 'com.android.library'
    id 'maven-publish'
}

group = 'io.github.lamppkk.xanhbrowser'
version = '1.0.0-alpha.1'

android {
    namespace = 'io.github.lamppkk.xanhbrowser.sync'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }
    buildToolsVersion = '36.1.0'

    defaultConfig {
        minSdk = 26
        consumerProguardFiles 'consumer-rules.pro'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    publishing {
        singleVariant('release') { withSourcesJar() }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'xanh-sync-android'
                pom {
                    name = 'Xanh Sync Android'
                    description = 'Pinned Mozilla Accounts / Firefox Sync integration for Xanh Browser editions'
                    licenses {
                        license {
                            name = 'Mozilla Public License 2.0'
                            url = 'https://www.mozilla.org/MPL/2.0/'
                        }
                    }
                }
            }
        }
        repositories {
            maven {
                name = 'build'
                url = layout.buildDirectory.dir('maven')
            }
        }
    }
}

dependencies {
    // Keep this set in lockstep with midori-core/xanh-sync-core/
    // APPLICATION_SERVICES.lock. Do not use dynamic or nightly versions.
    api 'org.mozilla.appservices:fxaclient:155.0'
    api 'org.mozilla.appservices:places:155.0'
    api 'org.mozilla.appservices:syncmanager:155.0'
    api 'org.mozilla.appservices:logins:155.0'
    api 'org.mozilla.appservices:tabs:155.0'

    implementation 'androidx.annotation:annotation:1.10.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
