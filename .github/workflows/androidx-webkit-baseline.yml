name: AndroidX WebKit stable baseline

on:
  push:
    paths:
      - .github/workflows/androidx-webkit-baseline.yml
      - scripts/verify_androidx_webkit_latest.py
      - scripts/tests/test_verify_androidx_webkit_latest.py
      - app/build.gradle
      - gradle/verification-metadata.xml
  pull_request:
    paths:
      - .github/workflows/androidx-webkit-baseline.yml
      - scripts/verify_androidx_webkit_latest.py
      - scripts/tests/test_verify_androidx_webkit_latest.py
      - app/build.gradle
      - gradle/verification-metadata.xml
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: androidx-webkit-stable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test latest-stable parser and project pin policy
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_verify_androidx_webkit_latest.py' -v
      - name: Verify project uses latest stable AndroidX WebKit
        run: python3 scripts/verify_androidx_webkit_latest.py
