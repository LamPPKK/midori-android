name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.1.0'
      - run: >-
          ./gradlew --no-daemon
          :backup-core:testDebugUnitTest
          :sync-core:lintDebug
          :sync-core:testDebugUnitTest
          :sync-core:assembleDebug
          :sync-core:assembleRelease
          :sync-core:assembleAndroidTest
          :sync-core:publishReleasePublicationToBuildRepository
          :app:lintDebug
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleAndroidTest
          :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: xanh-browser-android
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/lint-results-debug.*
            sync-core/build/outputs/aar/*.aar
            sync-core/build/maven/**
            sync-core/build/reports/lint-results-debug.*
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: xanh-browser-android-sbom.cdx.json

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
