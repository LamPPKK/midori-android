plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
}

def uploadStoreFile = providers.gradleProperty('xanhUploadStoreFile')
    .orElse(providers.environmentVariable('XANH_ANDROID_KEYSTORE')).orNull
def uploadStorePassword = providers.gradleProperty('xanhUploadStorePassword')
    .orElse(providers.environmentVariable('XANH_ANDROID_STORE_PASSWORD')).orNull
def uploadKeyAlias = providers.gradleProperty('xanhUploadKeyAlias')
    .orElse(providers.environmentVariable('XANH_ANDROID_KEY_ALIAS')).orNull
def uploadKeyPassword = providers.gradleProperty('xanhUploadKeyPassword')
    .orElse(providers.environmentVariable('XANH_ANDROID_KEY_PASSWORD')).orNull
def hasUploadSigning = [uploadStoreFile, uploadStorePassword, uploadKeyAlias, uploadKeyPassword].every { it }

android {
    namespace = 'io.github.lamppkk.xanhbrowser'
    compileSdk = 36

    defaultConfig {
        applicationId = 'io.github.lamppkk.xanhbrowser'
        minSdk = 26
        targetSdk = 36
        versionCode = 10000
        versionName = '1.0.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        ksp {
            arg('room.schemaLocation', "$projectDir/schemas")
            arg('room.incremental', 'true')
        }
    }

    signingConfigs {
        if (hasUploadSigning) {
            release {
                storeFile = file(uploadStoreFile)
                storePassword = uploadStorePassword
                keyAlias = uploadKeyAlias
                keyPassword = uploadKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasUploadSigning) signingConfig = signingConfigs.release
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

tasks.register('verifyReleaseSigning') {
    doLast {
        if (!hasUploadSigning) {
            throw new GradleException('Xanh Browser upload-key environment variables are not configured')
        }
    }
}

tasks.matching { it.name == 'bundleRelease' }.configureEach {
    mustRunAfter 'verifyReleaseSigning'
}

tasks.register('bundleProductionRelease') {
    dependsOn 'verifyReleaseSigning', 'bundleRelease'
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.12.3'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    implementation 'com.google.android.material:material:1.13.0'
    ksp 'androidx.room:room-compiler:2.8.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.room:room-testing:2.8.4'
}
